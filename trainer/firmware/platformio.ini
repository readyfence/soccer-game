; Soccer Trainer firmware for the M5Stack CoreS3.
; Build and upload from VS Code with the PlatformIO extension (see ../README.md),
; or from a terminal: pio run -t upload

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  m5stack/M5Unified@^0.2.7
  bblanchon/ArduinoJson@^7.2.0
